name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Permissions for deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Defold HTML5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Get Defold Stable Engine Version
        id: defold-version
        run: |
          SHA1=$(curl -s https://d.defold.com/stable/info.json | jq -r .sha1)
          if [ -z "$SHA1" ] || [ "$SHA1" = "null" ]; then
            SHA1="ee283d4dad9fa451dd6399d83602e1dc25133681"
          fi
          echo "sha1=$SHA1" >> $GITHUB_OUTPUT
          echo "Defold Engine SHA1: $SHA1"

      - name: Download Defold bob.jar
        run: |
          mkdir -p tools
          curl -L -o tools/bob.jar "https://d.defold.com/archive/${{ steps.defold-version.outputs.sha1 }}/bob/bob.jar"

      - name: Resolve Project Dependencies
        run: |
          java -jar tools/bob.jar --email dummy@example.com --auth dummy_token resolve

      - name: Build and Bundle HTML5 (WASM)
        run: |
          java -jar tools/bob.jar \
            --platform js-web \
            --architectures wasm-web \
            --archive \
            --bundle-output build/bundle \
            build bundle

      - name: Locate HTML5 Bundle Output
        id: find-bundle
        run: |
          INDEX_PATH=$(find build/bundle -name "index.html" | head -n 1)
          if [ -z "$INDEX_PATH" ]; then
            echo "Error: index.html not found in build/bundle"
            exit 1
          fi
          BUNDLE_DIR=$(dirname "$INDEX_PATH")
          echo "Found bundle at: $BUNDLE_DIR"
          echo "bundle_dir=$BUNDLE_DIR" >> $GITHUB_OUTPUT

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find-bundle.outputs.bundle_dir }}

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
